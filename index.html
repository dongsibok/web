<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 차량운행일지</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f4f7f6; color: #333; line-height: 1.6; }
        .container { max-width: 700px; margin: 20px auto; padding: 0 15px; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 2rem; margin-bottom: 5px; color: #007bff; }

        .form-card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 15px; border: 1px solid #ddd; }
        .section-title { font-size: 1.2rem; color: #333; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 1px solid #eee; }

        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-row-single { grid-template-columns: 1fr; } 
        .form-group { display: flex; flex-direction: column; }
        
        label { font-weight: 500; margin-bottom: 5px; font-size: 0.9rem; }
        
        select, input[type="text"], input[type="number"], input[type="time"], input[type="date"], textarea {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #007bff; }
        textarea { resize: vertical; min-height: 80px; }

        .km-display { background: #e9ecef !important; font-weight: bold !important; text-align: center !important; }
        
        .time-input-group { display: flex; gap: 5px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; transition: background-color 0.2s; }
        .btn-success { background: #28a745; color: white; width: 100%; padding: 12px; margin-top: 10px; }
        .btn-success:hover { background: #218838; }
        .btn-success:disabled { background: #6c757d; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }

        .alert { padding: 12px; border-radius: 4px; margin: 10px 0; font-weight: 500; display: none; }
        .alert.show { display: block; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        
        /* 오프라인 큐 알림 */
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        .saved-data { 
            background: #f8f9fa; 
            border-left: 4px solid #28a745; 
            padding: 12px 15px; 
            margin-top: 10px; 
            border-radius: 4px; 
            font-size: 0.9rem; 
        }
        .saved-data-title { 
            font-weight: bold; 
            color: #155724; 
            margin-bottom: 8px; 
            font-size: 1rem; 
        }
        .saved-data-item { 
            display: grid; 
            grid-template-columns: 120px 1fr; 
            gap: 10px; 
            padding: 4px 0; 
            border-bottom: 1px dotted #dee2e6; 
        }
        .saved-data-item:last-child { border-bottom: none; }
        .saved-data-label { font-weight: 500; color: #666; }
        .saved-data-value { color: #333; word-break: break-word; }
        
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); color: white;
            display: none; align-items: center; justify-content: center; z-index: 9999; font-size: 1.2rem;
            flex-direction: column; gap: 15px;
        }
        .loading-spinner { 
            width: 40px; height: 40px; 
            border: 4px solid rgba(255,255,255,0.3); 
            border-top: 4px solid white; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .helper-text { font-size: 0.85rem; color: #666; margin-top: 3px; }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 차량운행일지</h1>
            <p>동대문시각특화장애인복지관</p>
        </div>

        <div class="alert alert-success" id="successAlert"></div>
        <div class="alert alert-info" id="queueAlert"></div>
        <div id="savedDataDisplay" style="display: none;"></div>
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-warning" id="warningAlert"></div>

        <form id="vehicleLogForm">
            <div class="form-card">
                <h2 class="section-title">👤 기본 정보</h2>
                
                <div class="form-group">
                    <label for="vehicle">차량번호</label>
                    <select id="vehicle" name="vehicle" required>
                        <option value="">차량을 선택하세요</option>
                        <option value="신스파크">신스파크(257고1416)</option>
                        <option value="구스파크">구스파크(40보2224)</option>
                        <option value="레이">레이(28저7467)</option>
                        <option value="K스타렉스">K스타렉스(72마7689)</option>
                        <option value="G스타렉스">G스타렉스(71더7566)</option>
                        <option value="이카운티">이카운티(72버5995)</option>
                    </select>
                </div>

                <div class="form-row form-row-single">
                    <div class="form-group">
                        <label for="driver">운전자 (선택 또는 직접 입력)</label>
                        <input type="text" id="driver" name="driver" list="driverList" placeholder="운전자 선택 또는 입력" required>
                        <datalist id="driverList">
                            <option value="강지연"></option><option value="김미경"></option><option value="전상석"></option><option value="김예근"></option>
                            <option value="김진범"></option><option value="문보은"></option><option value="문승준"></option><option value="박경혜"></option>
                            <option value="박애란"></option><option value="박예인"></option><option value="박일규"></option><option value="송은교"></option>
                            <option value="여준형"></option><option value="오철수"></option><option value="옥수안"></option><option value="이광희"></option>
                            <option value="이경훈"></option><option value="임미진"></option><option value="임병수"></option><option value="장지예"></option>
                            <option value="진태진"></option><option value="최용근"></option><option value="허채영"></option><option value="허철민"></option>
                        </datalist>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <h2 class="section-title">🎯 운행 정보</h2>
                <div class="form-group">
                    <label for="customDestination">행선지</label>
                    <input type="text" id="customDestination" name="destination" placeholder="행선지를 입력하세요" required>
                </div>
                
                <div class="form-group">
                    <label for="purpose">운행목적 (선택 또는 직접 입력)</label>
                    <input type="text" id="purpose" name="purpose" list="purposeList" placeholder="운행 목적 선택 또는 입력" required>
                    <datalist id="purposeList">
                        <option value="이동지원"></option><option value="후원"></option><option value="프로그램"></option>
                        <option value="물품구입"></option><option value="기관방문"></option><option value="기타"></option>
                    </datalist>
                </div>
            </div>

            <div class="form-card">
                <h2 class="section-title">⏰ 시간 및 거리</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="tripDate">운행 날짜</label>
                        <input type="date" id="tripDate" name="tripDate" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="departureTime">출발시각</label>
                        <div class="time-input-group">
                            <input type="time" id="departureTime" name="departureTime" required style="flex-grow: 1;">
                            <button type="button" class="btn btn-secondary" id="setDepartureTimeBtn" title="현재 시각으로 설정">⏰</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="arrivalTime">도착시각</label>
                        <div class="time-input-group">
                            <input type="time" id="arrivalTime" name="arrivalTime" required style="flex-grow: 1;">
                            <button type="button" class="btn btn-secondary" id="setArrivalTimeBtn" title="현재 시각으로 설정">⏰</button>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="departureKm">출발km</label>
                        <input type="number" id="departureKm" name="departureKm" class="km-display" value="0" min="0">
                        <span class="helper-text">자동 불러옴 (필요시 수정 가능)</span>
                    </div>
                    <div class="form-group">
                        <label for="arrivalKm">도착km</label>
                        <input type="number" id="arrivalKm" name="arrivalKm" min="0" required>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <h2 class="section-title">📝 기타 정보</h2>
                <div class="form-group">
                    <label for="passengers">탑승자 명단 (선택)</label>
                    <input type="text" id="passengers" name="passengers" placeholder="이름을 쉼표(,)나 공백으로 구분하여 입력하세요">
                    <span class="helper-text">운전자 제외, 승객만 입력</span>
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <label for="note">비고 (차량 정비요청 사항 등)</label>
                    <textarea id="note" name="note" placeholder="정비 요청 사항, 특이사항 등을 기록하세요."></textarea>
                </div>
            </div>
            
            <button type="submit" class="btn btn-success" id="submitBtn">💾 기록 저장</button>
        </form>
    </div>

    <div id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div id="loadingMessage">처리 중...</div>
    </div>

<script>
        // 🚨 여기에 Apps Script 웹 앱 URL을 붙여넣으세요!
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzP1_Yiw0CMR53MBUaXrOd7Yhz3GaI2GgZeGA24NElbN_6OkT9j8xj8DlTohCet_351Zw/exec';
        const QUEUE_KEY = 'drivingLogOfflineQueue';

        document.addEventListener('DOMContentLoaded', () => {
            setCurrentDate();
            setupEventListeners();
            loadPersonalDefaults();
            checkOfflineQueue(); // 페이지 로드 시 전송 대기 중인 큐가 있는지 확인
        });

        // ==========================================
        // 1. 개인 설정(마지막 입력 정보) 로컬스토리지 관리
        // ==========================================
        function loadPersonalDefaults() {
            const lastDriver = localStorage.getItem('myLastDriver');
            const lastVehicle = localStorage.getItem('myLastVehicle');
            
            if (lastDriver) document.getElementById('driver').value = lastDriver;
            if (lastVehicle) {
                document.getElementById('vehicle').value = lastVehicle;
                handleVehicleChange(); // 차량이 선택되었으므로 주행거리 불러오기 실행
            }
        }

        function savePersonalDefaults(driver, vehicle) {
            localStorage.setItem('myLastDriver', driver);
            localStorage.setItem('myLastVehicle', vehicle);
        }

        // ==========================================
        // 2. 비동기 데이터 전송 (Optimistic UI 적용)
        // ==========================================
        async function handleFormSubmit(e) {
            e.preventDefault();
            
            if (!validateKm()) return;
            validateTime();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            const passengers = (data.passengers || '').split(/[\s,]+/).filter(p => p.trim() !== '');
            const departureKm = parseInt(data.departureKm) || 0;
            const arrivalKm = parseInt(data.arrivalKm) || 0;

            const logData = {
                id: Date.now(),
                driver: data.driver,
                vehicle: data.vehicle,
                passengerCount: passengers.length + 1, 
                passengers: passengers, 
                destination: data.destination.trim(),
                purpose: data.purpose,
                tripDate: data.tripDate,
                departureTime: data.departureTime,
                arrivalTime: data.arrivalTime,
                departureKm: departureKm,
                arrivalKm: arrivalKm,
                distance: arrivalKm - departureKm,
                note: data.note || '',
                recordDate: new Date().toISOString()
            };
            
            // 제출 버튼 잠금 및 Optimistic UI 처리
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ 저장하는 중...';

            // 내 설정 저장
            savePersonalDefaults(logData.driver, logData.vehicle);

            try {
                // 백그라운드로 비동기 전송 (fetch 0.1~0.2초 이내 리턴)
                // text/plain 꼼수를 통해 Preflight(OPTIONS) 요청 우회
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'addLog', data: logData }),
                    mode: 'no-cors' 
                }).then(() => {
                    // 성공 처리 - 백그라운드 전송이므로 응답 상태 확인 없이 성공으로 간주
                    submitBtn.disabled = false;
                    submitBtn.innerText = '💾 기록 저장';
                    showSuccess('작성완료');
                    displaySavedData(logData);
                    
                    // 폼 초기화 (차량/운전자 정보는 남겨둠)
                    document.getElementById('customDestination').value = '';
                    document.getElementById('purpose').value = '';
                    document.getElementById('passengers').value = '';
                    document.getElementById('note').value = '';
                    document.getElementById('departureKm').value = arrivalKm; // 다음 입력을 위해 도착km를 출발km로 이동
                    document.getElementById('arrivalKm').value = '';
                    setCurrentDate();
                }).catch((error) => {
                    throw error;
                });

            } catch (error) {
                // 네트워크 오류 등으로 fetch 자체 실패 시 오프라인 큐에 저장
                console.error('전송 실패, 큐에 저장합니다.', error);
                saveToQueue(logData);
                submitBtn.disabled = false;
                submitBtn.innerText = '💾 기록 저장';
                showQueueAlert('오프라인 상태입니다. 기기에 임시 저장되었으며 연결 시 자동 전송됩니다.');
            }
        }

        // ==========================================
        // 3. 오프라인 큐(Queue) 관리 로직
        // ==========================================
        function saveToQueue(logData) {
            let queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
            queue.push(logData);
            localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
            updateQueueStatusUI();
        }

        async function checkOfflineQueue() {
            let queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
            updateQueueStatusUI();

            if (queue.length > 0 && navigator.onLine) {
                showQueueAlert(`전송 대기 중인 데이터 ${queue.length}건을 서버로 전송합니다...`);
                let failedQueue = [];

                for (let logData of queue) {
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'addLog', data: logData }),
                            mode: 'no-cors'
                        });
                    } catch(e) {
                        failedQueue.push(logData);
                    }
                }

                localStorage.setItem(QUEUE_KEY, JSON.stringify(failedQueue));
                if (failedQueue.length === 0) {
                    showSuccess('대기 중이던 모든 데이터가 전송되었습니다.');
                }
                updateQueueStatusUI();
            }
        }

        // 온라인 상태 전환 감지 시 큐 재전송
        window.addEventListener('online', checkOfflineQueue);

        function updateQueueStatusUI() {
            let queue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
            const btn = document.getElementById('submitBtn');
            if(queue.length > 0) {
                btn.innerText = `💾 기록 저장 (대기 중: ${queue.length}건)`;
            } else {
                btn.innerText = '💾 기록 저장';
            }
        }

        // ==========================================
        // 기존 헬퍼 함수들
        // ==========================================
        function setCurrentDate() {
            const dateString = new Date().toISOString().split('T')[0];
            document.getElementById('tripDate').value = dateString;
        }
        
        function getCurrentTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function setupEventListeners() {
            document.getElementById('vehicle').addEventListener('change', handleVehicleChange);
            document.getElementById('vehicleLogForm').addEventListener('submit', handleFormSubmit);
            document.getElementById('arrivalKm').addEventListener('input', validateKm);
            document.getElementById('arrivalTime').addEventListener('change', validateTime);
            
            document.getElementById('setDepartureTimeBtn').addEventListener('click', () => {
                document.getElementById('departureTime').value = getCurrentTime();
            });
            document.getElementById('setArrivalTimeBtn').addEventListener('click', () => {
                document.getElementById('arrivalTime').value = getCurrentTime();
            });
        }

        async function handleVehicleChange() {
            const selectedVehicle = document.getElementById('vehicle').value;
            const departureKmInput = document.getElementById('departureKm');
            
            if (!selectedVehicle) {
                departureKmInput.value = 0;
                return;
            }

            try {
                // 출발 km를 가져오기 위해 로딩 표시 대신 우측 안내 텍스트 변경
                const helperText = departureKmInput.nextElementSibling;
                const originalText = helperText.innerText;
                helperText.innerText = "조회 중...";

                const response = await fetch(`${SCRIPT_URL}?action=getInitialData`);
                const data = await response.json();
                
                if (data.status === 'success' && data.vehiclesKm[selectedVehicle]) {
                    departureKmInput.value = data.vehiclesKm[selectedVehicle].lastKm;
                    helperText.innerText = "서버에서 불러옴";
                }
                setTimeout(() => helperText.innerText = originalText, 2000);
            } catch (error) {
                console.error('주행 거리 로드 오류:', error);
                // 오류 시 기존에 입력되어있던 값이 유지되게 하거나 0으로 초기화
            }
        }

        function validateKm() {
            const dep = parseInt(document.getElementById('departureKm').value) || 0;
            const arr = parseInt(document.getElementById('arrivalKm').value) || 0;
            if (arr > 0 && arr < dep) {
                showError('도착km는 출발km보다 작을 수 없습니다.');
                return false;
            }
            return true;
        }

        function validateTime() {
            const dep = document.getElementById('departureTime').value;
            const arr = document.getElementById('arrivalTime').value;
            if (dep && arr && dep > arr) {
                showWarning('도착시각이 출발시각보다 빠릅니다. 확인해주세요.');
                return false;
            }
            return true;
        }

        function showAlert(id, message, duration = 3000) {
            const alert = document.getElementById(id);
            alert.textContent = message;
            alert.classList.add('show');
            setTimeout(() => alert.classList.remove('show'), duration);
        }
        function showSuccess(message) { showAlert('successAlert', message); }
        function showError(message) { showAlert('errorAlert', message, 5000); }
        function showWarning(message) { showAlert('warningAlert', message, 5000); }
        function showQueueAlert(message) { showAlert('queueAlert', message, 5000); }

        function displaySavedData(logData) {
            const displayDiv = document.getElementById('savedDataDisplay');
            const passengerList = logData.passengers.length > 0 ? logData.passengers.join(', ') : '없음';
            
            displayDiv.innerHTML = `
                <div class="saved-data">
                    <div class="saved-data-title">✅ 작성완료!</div>
                    <div class="saved-data-item"><span class="saved-data-label">🚗 차량</span><span class="saved-data-value">${logData.vehicle}</span></div>
                    <div class="saved-data-item"><span class="saved-data-label">🎯 행선지</span><span class="saved-data-value">${logData.destination}</span></div>
                    <div class="saved-data-item"><span class="saved-data-label">📏 주행거리</span><span class="saved-data-value">${logData.distance.toLocaleString()}km 주행</span></div>
                </div>
            `;
            displayDiv.style.display = 'block';
            setTimeout(() => displayDiv.style.display = 'none', 8000);
        }
    </script>
</body>
</html>
